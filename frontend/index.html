<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dino Game</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
  <main id="app">
    <input id="player-name" type="text" maxlength="20" placeholder="Seu nome" autocomplete="nickname">

    <div id="game-box">
      <canvas id="game"></canvas>
      <div id="start-overlay">
        <button id="start-button" type="button">Iniciar jogo</button>
      </div>
    </div>

    <div id="gameover-panel" hidden>
      <button id="save-score" type="button">Salvar score</button>
      <button id="play-again" type="button">Jogar de novo</button>
    </div>

    <section id="ranking">
      <h2>Ranking</h2>
      <p id="ranking-status"></p>
      <ol id="ranking-list"></ol>
    </section>
  </main>
  <script type="module" src="game.js"></script>
  </body>
</html>
